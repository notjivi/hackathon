# 🛡️ SECURED BY AEGIS SENTINEL 🛡️
# Autonomous K8s Remediation Applied

apiVersion: v1
kind: Namespace
metadata:
  name: juice-ns
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: juice-admin-sa
  namespace: juice-ns
---
# FIXED: Removed ClusterRoleBinding granting cluster-admin
apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop
  namespace: juice-ns
  labels:
    app: juice-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juice-shop
  template:
    metadata:
      labels:
        app: juice-shop
    spec:
      serviceAccountName: juice-admin-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001 # Added runAsGroup
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: juice-shop
        image: bkimminich/juice-shop:v12.0.0
        ports:
        - containerPort: 3000
          # FIXED: Removed hostPort: 80 binding
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          capabilities:
            drop: ["ALL"]
            # FIXED: Removed NET_BIND_SERVICE capability
        env:
        - name: NODE_ENV
          value: "production"
        # FIXED: Migrated hardcoded plaintext to secure secretKeyRefs
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: juice-secrets
              key: db-password
        - name: STRIPE_API_KEY
          valueFrom:
            secretKeyRef:
              name: juice-secrets
              key: stripe-api-key
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /#/login
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /#/login
            port: 3000
          initialDelaySeconds: 20
          periodSeconds: 20
      # FIXED: Completely stripped hostPath volumes and volumeMounts
---
apiVersion: v1
kind: Service
metadata:
  name: juice-shop-service
  namespace: juice-ns
spec:
  type: LoadBalancer
  # FIXED: Restricted LoadBalancer exposure to internal subnets
  loadBalancerSourceRanges:
  - "10.0.0.0/8"
  ports:
  - port: 80
    targetPort: 3000
  selector:
    app: juice-shop
